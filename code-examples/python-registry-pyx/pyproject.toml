[project]
name = "test-project"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2"]
heavy-rarely-updated = ["torch==2.9.0"]
light-frequently-updated = ["fastapi==0.120.1", "uvicorn==0.38.0"]

[tool.uv]
default-groups = ["dev", "heavy-rarely-updated", "light-frequently-updated"]

[[tool.uv.index]]
name = "pyx"
url = "https://api.pyx.dev/v1/upload/skynopy/main/"
publish-url = "https://api.pyx.dev/v1/upload/skynopy/main"
explicit = true

[[tool.uv.index]]
name = "pyx-pypi-mirror"
url = "https://api.pyx.dev/simple/pypi"
default = true


[[tool.uv.index]]
name = "pyx-cu126"
url = "https://api.pyx.dev/simple/astral-sh/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pyx-cu126" }
